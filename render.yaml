services:
  - type: web
    name: chess-analyzer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chess-analyzer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REGISTRATION_CODE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STOCKFISH_PATH
        value: /usr/games/stockfish
      - key: ENGINE_DEPTH
        value: "18"
      - key: ENGINE_SCAN_DEPTH
        value: "10"
      # TEMPORARY: re-derives the stored accuracies with the Lichess model at
      # boot, so the corrected numbers show up without waiting for every game
      # to come back through the re-analysis queue. Remove after one deploy.
      - key: RECOMPUTE_ACCURACY_ON_BOOT
        value: "true"
      - key: POLL_INTERVAL_SECONDS
        value: "90"

databases:
  - name: chess-analyzer-db
    plan: free
