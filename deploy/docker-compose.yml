# Full stack for a single Oracle Always Free Ampere A1 instance.
#
# Only Caddy publishes ports. Postgres and the API are reachable on the compose
# network alone, so nothing depends on getting the host firewall exactly right
# and a mistake there cannot expose the database.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      REGISTRATION_CODE: ${REGISTRATION_CODE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STOCKFISH_PATH: /usr/games/stockfish
      # One thread, not two: the box has two dedicated cores and this leaves one
      # of them for uvicorn, so a long analysis can never make the site crawl.
      # Raise to 2 once the re-analysis backlog is drained if you want.
      ENGINE_THREADS: ${ENGINE_THREADS:-1}
      # A big transposition table makes the engine stronger, and it also keeps
      # resident memory above the 20% floor that Oracle's idle-instance
      # reclamation checks. See the runbook.
      ENGINE_HASH_MB: ${ENGINE_HASH_MB:-2048}
      ENGINE_DEPTH: ${ENGINE_DEPTH:-18}
      ENGINE_SCAN_DEPTH: ${ENGINE_SCAN_DEPTH:-10}
      ENGINE_MAX_TIME: ${ENGINE_MAX_TIME:-3.0}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-90}
      RECOMPUTE_ACCURACY_ON_BOOT: ${RECOMPUTE_ACCURACY_ON_BOOT:-false}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
